name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $text = Get-Content -LiteralPath Cargo.toml -Raw
          if ($text -notmatch '(?ms)\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"') {
            throw "Could not read [workspace.package] version from Cargo.toml"
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match Cargo.toml version '$version' (expected 'v$version')"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Package portable zip
        shell: pwsh
        run: .\scripts\package-portable.ps1

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/TranslatorOverlay-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Missing $zip"
          }
          gh release create $env:GITHUB_REF_NAME $zip --draft --generate-notes --title "Translator Overlay $version"
