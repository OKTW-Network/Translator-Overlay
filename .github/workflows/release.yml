name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $text = Get-Content -LiteralPath Cargo.toml -Raw
          if ($text -notmatch '(?ms)\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"') {
            throw "Could not read [workspace.package] version from Cargo.toml"
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match Cargo.toml version '$version' (expected 'v$version')"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      package: true

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: TranslatorOverlay-*-win-x64.zip
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          $zip = "dist/TranslatorOverlay-$env:VERSION-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Missing $zip"
          }
          gh release create $env:GITHUB_REF_NAME $zip --draft --generate-notes --title "Translator Overlay $env:VERSION"
