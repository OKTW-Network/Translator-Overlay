name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  ort:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-win-x64
          key: ort-${{ hashFiles('scripts/build-onnxruntime.ps1') }}
      - name: Build ONNX Runtime
        shell: pwsh
        run: .\scripts\build-onnxruntime.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: onnxruntime-win-x64
          path: third_party/onnxruntime-win-x64
          if-no-files-found: error

  check:
    needs: ort
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: onnxruntime-win-x64
          path: third_party/onnxruntime-win-x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  package:
    if: github.event_name == 'push'
    needs: ort
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: onnxruntime-win-x64
          path: third_party/onnxruntime-win-x64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package portable zip
        shell: pwsh
        run: .\scripts\package-portable.ps1
      - uses: actions/upload-artifact@v7
        with:
          path: dist/TranslatorOverlay-*-win-x64.zip
          archive: false
          if-no-files-found: error
