[package]
name = "translator-app"
version.workspace = true
edition = "2024"

[dependencies]
bytes = { workspace = true }
parking_lot = { workspace = true }
rust-i18n = "4.2.4"
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
translator-capture = { path = "../translator-capture" }
translator-core = { path = "../translator-core" }
translator-ocr = { path = "../translator-ocr" }
translator-overlay = { path = "../translator-overlay" }
translator-translate = { path = "../translator-translate" }
translator-winui = { path = "../translator-winui" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
[build-dependencies]
winresource = "0.1.34"
