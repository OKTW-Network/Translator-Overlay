[package]
name = "translator-translate"
version.workspace = true
edition = "2024"

[dependencies]
fastrand = "2.5.0"
half = "2.7.1"
minijinja = { version = "3.1.0", default-features = false, features = [
    "adjacent_loop_items",
    "builtins",
    "json",
    "loop_controls",
    "macros",
    "serde",
] }
minijinja-contrib = { version = "3.1.0", default-features = false, features = ["pycompat"] }
ort = { workspace = true, features = ["half"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
translator-core = { path = "../translator-core" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
