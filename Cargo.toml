[workspace]
resolver = "3"
members = [
    "crates/translator-app",
    "crates/translator-capture",
    "crates/translator-core",
    "crates/translator-ocr",
    "crates/translator-overlay",
    "crates/translator-translate",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
arc-swap = "1.9"
bytes = "1.12.1"
image = { version = "0.25.10", default-features = false }
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
windows = { version = "0.62" }
